name: ngoma
description: "NGoma starter project (Flutter + TModeler)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.0
  flutter_riverpod: ^3.2.0
  wouanda_design:
    path: packages/wouanda_design
  wouanda_foundation:
    path: packages/wouanda_foundation
  go_router: ^17.0.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.4
  geolocator: ^14.0.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^11.0.0
  url_launcher: ^6.3.1
  record: ^6.2.0
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  http: ^1.6.0
  share_plus: ^12.0.1
  video_player: ^2.9.2
  lucide_icons_flutter: ^3.1.12
  pdfx: ^2.11.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/auth/
    - assets/images/hub/
    - assets/fonts/manrope/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
